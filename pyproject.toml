[project]
name = "urbanflow"
version = "0.1.0"
description = "Reproducible pedestrian activity experiments over OpenStreetMap"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.53,<0.54",
  "pydantic>=2.13.5,<3",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "asyncpg>=0.31,<0.32",
  "alembic>=1.20,<2",
  "geoalchemy2>=0.20,<0.21",
  "shapely>=2.1.2,<3",
  "pyproj>=3.8,<4",
  "networkx>=3.6.1,<4",
  "httpx>=0.28.1,<0.29",
  "streamlit>=1.64,<1.65",
  "pydeck>=0.9.3,<0.10",
  "folium>=0.20,<0.21",
  "streamlit-folium>=0.27.4,<0.28",
  "pydantic-settings>=2.15,<3",
  "openai>=3.16.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4", "ruff>=0.16.8", "pyright>=1.1.414"]
geo-research = ["osmnx>=2.1.1,<3", "geopandas>=1.1.4,<2"]

[project.scripts]
urbanflow = "urbanflow.cli:main"

[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanflow"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a migrated PostgreSQL/PostGIS database"]
